requires-python = ">=3.12,<3.13"
dependencies = [
    "altair>=5,<7",
    "langchain-openai==1.7.4",
    "langgraph==1.2.20",
    "marimo>=0.20,<1",
    "pandas==3.0.1",
    "pydantic==2.14.3",
]

[tool.uv]
package = false

[tool.marimo.runtime]
auto_instantiate = true
