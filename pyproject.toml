[project]
name = "tradeatlas"
version = "0.1.0"
description = "Groundnut sourcing and forecasting labs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "altair>=5,<7",
    "python-dotenv>=1.0.0",
    "duckdb==1.5.6",
    "httpx>=0.28.0",
    "ipykernel>=7.4.0",
    "langchain-google-genai>=4.5.0",
    "langchain-openai==1.7.4",
    "langgraph==1.2.20",
    "marimo>=0.20,<1",
    "mcp>=1.2.0",
    "ormsgpack==1.13.0",
    "pandas==3.0.1",
    "pydantic==2.14.3",
    "pydantic-settings>=2.16.3",
    "xxhash==3.5.0",
    "langchain>=1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "deepeval>=4.3.4",
    "pytest>=8",
]

[tool.pytest.ini_options]
# langsmith's pytest plugin (entry point `langsmith_plugin`, transitive via
# langchain) fails to import under local Application Control policy; its
# tracing is not used by this suite.
addopts = "-p no:langsmith_plugin"
# The agent builds on langchain.agents.create_agent (langchain 1.5.0) — the
# successor of the deprecated langgraph.prebuilt.create_react_agent; no
# deprecation filter is needed since the migration (migrate-agent-to-create-agent).

[tool.marimo.runtime]
auto_instantiate = true
